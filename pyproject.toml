[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nailfold-report"
version = "0.1.0"
description = "Case-level nailfold image/video to structured doctor-report prediction"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.57",
  "accelerate>=1.0",
  "safetensors>=0.4",
]
dev = ["jsonschema[format]>=4.23", "pytest>=8.0", "ruff>=0.8"]
deploy = [
  "onnxruntime-gpu>=1.21,<1.27",
  "opencv-python-headless==4.13.0.92",
  "joblib>=1.4",
  "scikit-learn==1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Preserve the exact training sources used by the completed experiments.
"scripts/train_fusion_cv.py" = ["E731"]
"scripts/train_geometry_final.py" = ["F401"]
"scripts/train_siglip_case_finetune.py" = ["E702"]
"scripts/train_video_final.py" = ["F401"]
"scripts/train_video_temporal.py" = ["E702"]
"src/nailfold_report/data/manifest.py" = ["F401"]
