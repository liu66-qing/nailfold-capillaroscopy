# Frozen BEFORE any feature was extracted or any metric computed.
# Addendum: rescue_plan_medical_encoder_addendum_20260921.md sections 5 and 7.
# Anything changed after the first metric is read must be recorded as an amendment
# with its reason, not edited in place.

schema_version: medical-encoder-transfer/1.0
frozen_at: 2026-09-21
status: pre-registration

question: >
  Does a MEDICALLY pretrained frozen image encoder beat the deployed general
  DINOv2-B on the rescue fields, once capacity is controlled for? The control arm
  exists because the deployed anchor is ViT-B/14 and any medical candidate that is
  larger would otherwise confound capacity with pretraining domain.

# ---------------------------------------------------------------- access
# Determined 2026-09-21 before extraction, recorded here so the blocked arms
# cannot later be described as "not tried".
access_determination:
  google/medsiglip-448:
    gated: auto
    anonymous_download: 401
    with_existing_account_token: 403
    status: blocked_access
    note: >
      HAI-DEF terms not accepted on this account. Accepting licence terms on the
      user's behalf is not authorised, so this arm is not run.
  YukunZhou/RETFound_dinov2_meh:
    gated: auto
    with_existing_account_token: 403
    status: blocked_access
  YukunZhou/RETFound_mae_natureCFP:   # the pre-registered RETFound fallback
    gated: auto
    status: blocked_access
  fallback_taken: >
    Addendum section 1 permits BiomedCLIP when MedSigLIP is unobtainable, on
    condition no equivalent experiment already exists. A grep over scripts/ and
    artifacts/ found zero prior BiomedCLIP run, and its weights are already on
    disk, so BiomedCLIP becomes the medical arm for round one.

# ---------------------------------------------------------------- arms
arms:
  - id: anchor_dinov2b_deployed
    role: anchor
    encoder: dinov2_vitb14
    pretraining: general (LVD-142M)
    params_vision: 86M
    why: the currently deployed encoder; reproduces the shipped numbers
  - id: dinov2b_newloader
    role: loader_control
    encoder: dinov2_vitb14
    pretraining: general (LVD-142M)
    why: >
      same weights as the anchor through the NEW loader and NEW preprocessing, so
      that a loader or resize difference cannot be attributed to pretraining
  - id: dinov2l_capacity
    role: capacity_control
    encoder: dinov2_vitl14
    pretraining: general (LVD-142M)
    params_vision: 304M
    why: isolates capacity from medical pretraining
  - id: biomedclip_medical
    role: medical_candidate
    encoder: ViT-B/16 image tower of BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
    pretraining: medical (PMC-15M figure-caption pairs)
    params_vision: 86M
    why: >
      medical pretraining at the SAME capacity as the anchor. Image tower only;
      no text tower, no zero-shot prompting, no caption generation.

# ---------------------------------------------------------------- endpoints
endpoints:
  primary: malformation_ratio       # fixed by the addendum; not exchangeable
  secondary: papilla
  retained_capability_monitor: [clarity, exudation, subpapillary_venous_plexus, blood_color]
  exploratory: [rbc_aggregation]
  excluded_from_success_criteria:
    - vasomotion, wbc_count, sweat_duct, hemorrhage   # fixed fields
    - flow_speed_um_s                                  # deleted column
    - afferent_diameter, efferent_diameter, apex_diameter, loop_length, capillary_count
  note: >
    microthrombus may be reported as correlation only; a static frame cannot
    evidence an events-per-minute count.

# ---------------------------------------------------------------- protocol
data:
  split_column: development_fold        # NaN == locked-47
  n_cases_expected: 186
  n_images_expected: 1708
  locked47: >
    never read, never used for selection, thresholds or adaptation. Each run
    records whether it touched locked; no claim is made about project history.
  report_scans_excluded: true           # rep_* images are never encoder inputs
  statistical_unit: exam_case_id        # frames and augmentations add no samples

preprocessing:
  geometry: aspect-preserving resize then pad to the encoder's supported size
  pad_value: the encoder's own normalisation-neutral value
  normalisation: each encoder's official mean/std, not a shared one
  forbidden: [fundus circular crop, colour standardisation, histogram matching,
              greyscale, blur augmentation, colour jitter, super-resolution]
  reason_forbidden: blood_color and clarity are targets; those transforms erase them

readout:
  round_one: single global vector per image (CLS for DINOv2, image embedding for BiomedCLIP)
  caveat: >
    readout differs by model family, so this is a system comparison; it does not
    isolate the causal effect of pretraining alone.

head:
  pipeline: train-fold StandardScaler -> PCA(min(64, train rank)) -> LogisticRegression
  C_grid: [0.003, 0.03, 0.3]           # the only tuned parameter
  class_weight: null                    # balanced is banned by prior finding
  frame_aggregation: mean of image probabilities within a case, then threshold 0.5
  fit_discipline: scaler/PCA/head fit on training folds only, never on all of dev

evaluation:
  outer: fixed development_fold (5 folds), case-level
  inner: C selected inside training folds only
  external: leave-one-archive-out, held-out archive excluded from selection too
  bootstrap: case-level resampling, 2000 draws
  paired: same-case paired difference against the anchor
  report: [accuracy, delta_vs_single_constant_baseline, balanced_accuracy,
           per_class_recall, auroc, miss_rate, false_alarm_rate, ci95]
  unestimable_marked: true              # never silently drop a missing class

# ---------------------------------------------------------------- thresholds
gates:
  continue_to_adaptation:
    primary_paired_ba_gain: ">= 0.03"
    same_direction_folds: ">= 3/5"
    minority_recall_collapse: forbidden
  adopt_candidate:
    primary_ba_gain: ">= 0.05"
    paired_ci95_lower_bound: "> 0"
    loao_mean_improvement: "> 0"
    worst_archive_ba_drop: "<= 0.03"
    retained_fields_max_drop: 0.02
  inconclusive_if: CI crosses zero or direction flips across archives
  on_failure: mark rejected, keep the deployed model, delete nothing
  note: >
    these are engineering investment gates, not medical release criteria. Passing
    them earns candidate status only.

deliverables:
  - model_registry.json
  - baseline_manifest.json
  - features/<encoder>/
  - predictions_oof.csv, loao_predictions.csv
  - paired_metrics.json, candidate_selection.json
  - decision.md
  - rollback_check.json

# ---------------------------------------------------------------- amendments
amendments:
  - id: A1
    at: 2026-09-21
    before_any_metric_was_computed: true
    what: >
      The anchor arm now reproduces the deployed `native` geometry (direct resize
      to 518x686, no padding) instead of the new pad-to-square geometry.
    why: >
      As first implemented, the anchor and the loader control produced
      byte-identical features (verified with np.array_equal), so the control
      tested nothing. Splitting the geometry makes the anchor match deployment
      and lets the loader/geometry change be read off the anchor-vs-control pair.
    effect_on_gates: none; no metric had been computed when this was changed.
  - id: A2
    at: 2026-09-21
    what: >
      .tmp_probe/feat/dinov2/features.npy is NOT used as the deployed anchor,
      although its index is used for the image list.
    why: >
      It carries no metadata.json, so its weights, preset and preprocessing are
      unverifiable. Its row-0 correlation with the re-extracted anchor is 0.497,
      which is consistent with a different preprocessing, but that cannot be
      confirmed. An unverifiable baseline cannot anchor a paired comparison.
